[main]
font=JetBrainsMono Nerd Font:size=13
terminal=alacritty
prompt="> "
icons-enabled=yes
lines=10
width=46
horizontal-pad=18
vertical-pad=18
inner-pad=12

# Rows taller than the font's own metrics, which is what sets the height of
# each selectable item — and of the icons beside them.
line-height=24

layer=overlay
anchor=center

# The desktop focuses windows on hover, so a launcher that released keyboard
# focus would close the moment the pointer drifted over a window. Holding it
# exclusively keeps the menu open until Escape or a selection. An outside click
# can only dismiss it if focus-follows-mouse is turned off.
keyboard-focus=exclusive
exit-on-keyboard-focus-loss=yes

[border]
width=2
radius=16

[colors]
background=1e1e2ef2
text=cdd6f4ff
prompt=89b4faff
input=cdd6f4ff
match=89b4faff
selection=89b4faff
selection-text=16161eff
selection-match=16161eff
border=89b4faff
counter=6c7086ff
