<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Generic families resolve to the base faces shipped with the desktop. -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Liberation Sans</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any">
      <string>serif</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Liberation Serif</string>
    </edit>
  </match>

  <!-- The system font: the terminal, the bar, the launcher and anything else
       that asks for monospace. -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>monospace</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>JetBrainsMono Nerd Font</string>
    </edit>
  </match>

  <!-- Bengali: prefer a Bengali-capable family when the locale asks for it. -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>bn</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Bengali</string>
    </edit>
  </match>

  <!-- Chromium and Electron resolve missing glyphs one character at a time,
       without a lang on the pattern, so the rule above never fires for them and
       fontconfig falls through to a raw charset scan. Naming a Bengali family
       as a last-resort covers that path. Appending keeps it behind every family
       the app actually asked for, and charset matching outranks family
       matching, so a font that does not cover the codepoint is never pulled in:
       Latin, monospace, emoji, Nerd Font glyphs and CJK all resolve as before. -->
  <match target="pattern">
    <edit name="family" mode="append" binding="strong">
      <string>Noto Sans Bengali</string>
    </edit>
  </match>

  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Liberation Sans</family>
    </prefer>
  </alias>

  <alias>
    <family>ui-monospace</family>
    <default>
      <family>monospace</family>
    </default>
  </alias>

  <alias>
    <family>-apple-system</family>
    <prefer>
      <family>Liberation Sans</family>
    </prefer>
  </alias>

  <alias>
    <family>BlinkMacSystemFont</family>
    <prefer>
      <family>Liberation Sans</family>
    </prefer>
  </alias>

  <!-- Nerd Font glyphs and emoji ride along with every generic family so bar
       icons, terminals and UI chrome all render without per-app font config. -->
  <alias>
    <family>Liberation Sans</family>
    <accept>
      <family>JetBrainsMono Nerd Font</family>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>

  <alias>
    <family>sans-serif</family>
    <accept>
      <family>JetBrainsMono Nerd Font</family>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>

  <alias>
    <family>serif</family>
    <accept>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>

  <alias>
    <family>monospace</family>
    <accept>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>
</fontconfig>
